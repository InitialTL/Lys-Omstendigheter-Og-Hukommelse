# Change the app name to your unique Fly.io application name before launching.
# Use ONE machine only, because SQLite is stored on ONE non-replicated volume.
app = "lys-omstendigheter-og-hukommelse-ran6wg"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  STUDY_DATABASE = "/data/results.db"
  STUDY_REQUIRE_PERSISTENT_VOLUME = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  soft_limit = 20
  hard_limit = 32

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

  [http_service.checks.headers]
    Host = "localhost"

[[mounts]]
  source = "study_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
