# fly.toml app configuration file generated for lys-omstendigheter-og-hukommelse-ran6wg on 2026-11-02T18:08:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lys-omstendigheter-og-hukommelse-ran6wg'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'
  STUDY_DATABASE = '/data/results.db'
  STUDY_REQUIRE_PERSISTENT_VOLUME = '1'

[[mounts]]
  source = 'study_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 32
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

    [http_service.checks.headers]
      Host = 'localhost'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
