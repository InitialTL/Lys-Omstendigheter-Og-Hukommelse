name: Validate Hukommelse LM

on:
  push:
    branches: ['feature/hukommelse-lm-v2*']
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Lightweight SQLite resource probe
        run: python scripts/resource_probe.py
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Verify phase countdown regression
        working-directory: frontend
        run: npm run test:timing
      - name: Verify browser locale selection and RTL preparation
        working-directory: frontend
        run: npm run test:locale
      - name: Type check and production build
        working-directory: frontend
        run: npm run build
      - name: Prepare Chromium browser smoke tests
        run: |
          python -m pip install -r backend/requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Test mobile, tablet, desktop and complete experiment flow
        run: python scripts/ui_smoke.py
